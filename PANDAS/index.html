<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome AJEEM Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        .profile-corner {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            z-index: 20;
        }
        
        .profile-corner:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
            border-color: #f43f5e;
        }

        .profile-corner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content-container {
            text-align: center;
            max-width: 900px;
            padding: 20px;
            z-index: 10;
        }

        .animated-text {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 1px;
            margin-bottom: 50px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(40px);
            animation: cleanFadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .highlight-name {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        
        .highlight-life {
            color: #fbbf24;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        @keyframes cleanFadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .start-btn {
            display: inline-block;
            padding: 18px 55px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
            background-size: 200% auto;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
            transition: all 0.5s ease;
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            animation: cleanFadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .start-btn:hover {
            background-position: right center;
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.6);
        }

        .start-btn:active {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-corner">
        <img src="ajeem.jpeg" alt="Ajeem" id="myPhoto">
    </div>

    <div class="content-container">
        <h1 class="animated-text">
            Welcome <span class="highlight-name">AJEEM</span> website and <span class="highlight-life">enjoy your life</span>
        </h1>
        
        <button id="myLink" class="start-btn">Start</button>
    </div>

    <script>
        // Jismein aapki audio file ka naam store hai, iska naam mp3SoundName rakha gaya hai
        const mp3SoundName = "gaali.mp3"; 

        // Jismein aapki photo ka naam store hai, iska naam photoPath rakha gaya hai
        const photoPath = "ajeem.jpeg"; 


        const myAudio = new Audio(mp3SoundName);
        const myButton = document.getElementById('myLink');
        const myPhotoEl = document.getElementById('myPhoto');
        
        if (photoPath && photoPath.trim() !== "") {
            myPhotoEl.src = photoPath;
        }

        // Jab button par click hoga, tab sirf yeh function sound play karega
        myButton.addEventListener('click', function() {
            myAudio.play();
        });
    </script>
</body>
</html>
